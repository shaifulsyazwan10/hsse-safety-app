<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00008B"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script src="drive-config.js"></script></head><body><title>HSSE Site Audit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky toolbar, single 860px column of section cards; each question is a row with a 3-way answer switch. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d6dde4;
  --ink:#16222e; --ink-2:#4b5a68; --ink-3:#7a8896;
  --brand:#00008B; --brand-ink:#ffffff; --brand-fg:#00008B; --hivis:#f2b300; --hivis-ink:#1b1400;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --bad:#c62f2f; --bad-bg:#fbe6e5; --na:#6b7783; --na-bg:#e8ecef;
  --focus:#2d7ff9; --mv-site:#c9ebb0; --mv-office:#fff3a3; --mv-leave:#f9c6c6; --mv-off:#eef1f4; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --surface-2:#1d2833; --line:#2c3a47;
  --ink:#e6edf3; --ink-2:#a9b6c2; --ink-3:#7d8b98;
  --brand:#00008B; --brand-ink:#ffffff; --brand-fg:#9aa8ff; --hivis:#f5c02a; --hivis-ink:#1b1400;
  --ok:#4cc27e; --ok-bg:#16301f; --bad:#ff6b63; --bad-bg:#3a1b1a; --na:#9aa6b1; --na-bg:#25313c;
  --focus:#6fa8ff; --mv-site:#2b4a1c; --mv-office:#4a4212; --mv-leave:#4f2121; --mv-off:#1d2833; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --surface-2:#1d2833; --line:#2c3a47;
  --ink:#e6edf3; --ink-2:#a9b6c2; --ink-3:#7d8b98;
  --brand:#00008B; --brand-ink:#ffffff; --brand-fg:#9aa8ff; --hivis:#f5c02a; --hivis-ink:#1b1400;
  --ok:#4cc27e; --ok-bg:#16301f; --bad:#ff6b63; --bad-bg:#3a1b1a; --na:#9aa6b1; --na-bg:#25313c;
  --focus:#6fa8ff; --mv-site:#2b4a1c; --mv-office:#4a4212; --mv-leave:#4f2121; --mv-off:#1d2833; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);color:var(--ink);
  border-bottom:1px solid var(--line)}
.bar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.logo small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.08em;opacity:.8}
.bar .sp{flex:1}
.save-state{font-size:13px;opacity:.9;white-space:nowrap}

.wrap{max-width:900px;margin:0 auto;padding-block:18px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--hivis);color:var(--hivis-ink);border-color:var(--hivis)}
.btn.brand{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.bar .btn{background:transparent;color:var(--ink);border-color:var(--line)}

.bar .btn.primary{background:var(--hivis);color:var(--hivis-ink);border-color:var(--hivis)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.bar .btn{white-space:nowrap}
@media (max-width:520px){.logo{font-size:19px}.logo small{display:none}.save-state{display:none}.bar .btn{padding:7px 10px;min-height:38px;font-size:14px}
  .ans{display:grid;width:100%}.ans button{min-width:0}}

h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:30px}
h2{font-size:20px;text-transform:uppercase;letter-spacing:.05em}
.muted{color:var(--ink-2)}
.notice{border:1px solid var(--hivis);background:color-mix(in srgb,var(--hivis) 14%,var(--surface));border-radius:8px;padding:10px 14px;font-size:14px}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.tile .v{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:42px}
.toolbar input{flex:1;min-width:0}

/* audit list */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--brand-fg)}
.row .t{font-weight:700;font-size:17px;min-width:0}
.row .s{font-size:13px;color:var(--ink-2);min-width:0}
.row .r{display:flex;align-items:center;gap:8px;grid-row:span 2}
.pct{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.draft{background:color-mix(in srgb,var(--hivis) 25%,var(--surface));color:var(--ink)}
.pill.closed{background:var(--na-bg);color:var(--ink-2)}
.pill.nc{background:var(--bad-bg);color:var(--bad)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--ink-2)}

/* form */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--brand);color:var(--brand-ink)}
.card-h h2{flex:1;font-size:17px;min-width:0}
.card-h .sc{background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.card-b{padding:6px 16px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding-top:10px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.lbl{font-size:13px;font-weight:600;color:var(--brand-fg)}
.fld input,.fld select,.fld textarea,.q textarea,.q input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;width:100%;min-height:42px}
.fld textarea,.q textarea{min-height:42px;resize:vertical}
.req::after{content:" *";color:var(--bad)}

.q{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:10px}
.q:first-child{border-top:0}
.q-top{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:start}
.q-text{font-weight:600;min-width:0}
.q-text .no{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);margin-right:6px}
@media (max-width:620px){.q-top{grid-template-columns:1fr}}
.ans{display:inline-grid;grid-template-columns:repeat(3,auto);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ans button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:8px 14px;min-height:44px;min-width:76px;cursor:pointer;font-weight:700;line-height:1.1}
.ans button:first-child{border-left:0}
.ans button small{display:block;font-weight:500;font-size:11px;opacity:.85}
.ans button[aria-pressed="true"].y{background:var(--ok);color:#fff}
.ans button[aria-pressed="true"].n{background:var(--bad);color:#fff}
.ans button[aria-pressed="true"].x{background:var(--na);color:var(--surface)}
.q.is-n{background:linear-gradient(90deg,var(--bad-bg),transparent 70%);margin:0 -16px;padding-left:16px;padding-right:16px}
.q-extra{display:grid;grid-template-columns:1fr;gap:8px}
.q-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.small-btn{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-2);min-height:36px}
.small-btn:hover{border-color:var(--brand-fg);color:var(--brand-fg)}
.warn{color:var(--bad);font-size:13px;font-weight:600}

.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-weight:700;line-height:1}
.ph.loading::after{content:"Uploading…";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--ink-2)}

.sig{display:flex;flex-direction:column;gap:6px}
.sig canvas{width:100%;max-width:420px;height:150px;border:1px dashed var(--ink-3);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.sig img{max-width:300px;height:110px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line)}

/* sticky score bar on form */
.scorebar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.scorebar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.meter{flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px}
.meter .track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter .fill{height:100%;background:var(--brand);width:0%}
.meter .lab{font-size:13px;color:var(--ink-2)}

/* jump nav */
.jump{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.jump a{flex:none;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);text-decoration:none;white-space:nowrap}
.jump a.done{border-color:var(--ok);color:var(--ok)}
.jump a.has-nc{border-color:var(--bad);color:var(--bad)}
.jump a.off{opacity:.55;text-decoration:line-through}
.applic{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.applic .q-text{font-weight:700}
.ans.two{grid-template-columns:repeat(2,auto)}
.card.off .card-h{background:var(--na)}
.card.off .applic{border-bottom:0}
.q.missing,.applic.missing{box-shadow:inset 4px 0 0 var(--bad);background:var(--bad-bg);margin:0 -16px;padding-left:16px;padding-right:16px}
.applic.missing{margin:0}
.q.missing .q-text::after{content:"  Answer required";color:var(--bad);font-size:13px;white-space:nowrap}
.q.is-n textarea{border-color:var(--bad);background:var(--surface)}
.q textarea.c-missing{border-width:2px;box-shadow:0 0 0 3px var(--bad-bg)}
.pdfdoc{--mv-site:#c9ebb0;--mv-office:#fff3a3;--mv-leave:#f9c6c6;--mv-off:#eef1f4;position:fixed;left:-12000px;top:0;width:760px;display:flex;flex-direction:column;gap:14px;padding:0;
  --bg:#ffffff;--surface:#ffffff;--surface-2:#f5f7f9;--line:#d6dde4;--ink:#16222e;--ink-2:#4b5a68;--ink-3:#7a8896;
  --brand:#00008B;--brand-ink:#ffffff;--brand-fg:#00008B;--ok:#1f8a4c;--ok-bg:#e3f4ea;--bad:#c62f2f;--bad-bg:#fbe6e5;--na:#6b7783;--na-bg:#e8ecef;
  color-scheme:light;background:#fff;color:var(--ink)}
.pdfdoc .kv{grid-template-columns:220px 1fr}.pdfdoc .kv>div:nth-child(odd){border-bottom:1px solid var(--line);padding-bottom:8px}
.pdfdoc .tiles{grid-template-columns:repeat(4,1fr)}.pdfdoc .ph{width:150px;height:150px}
.pdf-head{display:flex;flex-direction:column;gap:12px;background:#fff}
.pdf-bar{display:flex;justify-content:space-between;align-items:center;background:var(--brand);color:#fff;padding:14px 18px;border-bottom:4px solid #f2b300;border-radius:8px}
.pdf-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:10px;border-bottom:4px solid var(--brand);box-shadow:0 4px 0 #f2b300}
.pdf-brand{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.04em;color:var(--brand);line-height:1.05}.pdf-brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--ink-2)}
.pdf-logo{height:62px;width:auto}
.pdf-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:6px}
.pdf-score{text-align:right;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}.pdf-score b{color:var(--brand)}
.pdf-score b{display:block;font-family:var(--f-display);font-size:30px;letter-spacing:0}
.tabs{background:var(--brand);border-bottom:3px solid var(--hivis)}
.tabs-in{max-width:900px;margin:0 auto;display:flex;gap:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;font-size:15px}
.tabs button[aria-current="true"]{color:#fff;border-bottom-color:var(--hivis)}
.tabs button{color:rgba(255,255,255,.72)!important}.tabs button[aria-current="true"]{color:#fff!important}.tabs button:hover{color:#fff!important}
.hdr-chip{display:inline-flex;background:#fff;border-radius:6px;padding:2px 4px;flex:none}
.hdr-chip img{height:38px;width:auto;display:block}
.bar .logo{color:var(--brand-fg);border-left:1px solid var(--line);padding-left:12px}
.bar .logo small{color:var(--ink-2);opacity:1}
@media (max-width:520px){.hdr-chip img{height:30px}.bar .logo{display:none}}
.bar-in,.tabs-in{max-width:1200px}
#app.wide{max-width:1200px}
.task{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;border-left:5px solid var(--na)}
.task:hover{border-color:var(--brand-fg)}
.task.st-O{border-left-color:var(--brand-fg)}.task.st-C{border-left-color:var(--ok)}
.tk-top{display:flex;gap:10px;align-items:flex-start}.tk-title{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.tk-meta{font-size:14px;color:var(--ink-2)}
.tk-prog{display:flex;align-items:center;gap:10px}.tk-prog .track{flex:1;height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.tk-prog .fill{height:100%;background:var(--brand-fg)}.task.st-C .tk-prog .fill{background:var(--ok)}
.tk-prog b{font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.tk-due{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.rem{font-weight:700;color:var(--ink)}.rem.soon{color:#b07a00}.rem.over{color:var(--bad)}.rem.done{color:var(--ok)}
.rem.big{font-size:15px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pill.tk-P{background:var(--na-bg);color:var(--ink-2)}.pill.tk-O{background:color-mix(in srgb,var(--brand-fg) 16%,var(--surface));color:var(--brand-fg)}.pill.tk-C{background:var(--ok-bg);color:var(--ok)}
.pill.pr-H{background:var(--bad);color:#fff}.pill.pr-M{background:var(--hivis);color:var(--hivis-ink)}.pill.pr-L{background:var(--ok);color:#fff}
.task.prb-H{box-shadow:inset 0 3px 0 var(--bad)}
.ans.prio button[aria-pressed="true"].pH{background:var(--bad);color:#fff}
.ans.prio button[aria-pressed="true"].pM{background:var(--hivis);color:var(--hivis-ink)}
.ans.prio button[aria-pressed="true"].pL{background:var(--ok);color:#fff}
.ans button[aria-pressed="true"].o{background:var(--brand);color:#fff}
@media (max-width:520px){.toolbar input[type=search]{flex:1 1 100%}}
.tabs-in{overflow-x:auto;scrollbar-width:none}.tabs button{white-space:nowrap;flex:none}
@media (max-width:520px){.tabs button{padding:11px 9px;font-size:14px}}
.tbrow{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.tbrow:hover{border-color:var(--brand-fg)}
.tbthumb{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.tbthumb img{width:100%;height:100%;object-fit:cover;display:block}
.tbthumb span{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;padding:1px 6px;border-radius:99px}
.tbinfo{min-width:0;display:flex;flex-direction:column;gap:3px}
.tbdate{font-size:13px;font-weight:700;color:var(--brand-fg);text-transform:uppercase;letter-spacing:.04em}
.tbtopic{font-weight:700;font-size:16px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pts{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:8px}
.pts li::marker{font-weight:700;color:var(--brand-fg)}
.pts li>*{vertical-align:middle}
.pts li{position:relative}
.pts input{width:calc(100% - 44px);border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;min-height:42px}
.ptrm{width:36px;height:36px;margin-left:6px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--ink-2)}
.pts-view{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tbbig .ph{width:min(100%,320px);height:auto;aspect-ratio:4/3}
.pdfdoc .tbbig .ph{width:340px;height:255px}
.pdfdoc .tbbig{gap:12px}
.notice.dev{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.notice.dev>div:first-child{flex:1 1 260px;min-width:0}
.drivechip{display:block;font-size:13px;margin-top:4px;color:var(--ink-2)}.drivechip:empty{display:none}
.drivechip.ok{color:var(--ok)}.drivechip.ok a{color:inherit;font-weight:700}.drivechip.wait{color:#b07a00}
.login{max-width:440px;width:100%;margin:24px auto 0}
/* dashboard */
.dash-head h1{font-size:30px}
.dash-filters select,.dash-filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:42px}
.df-custom{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:10px 6px;gap:6px}.kpi-ring{width:70px!important;height:70px!important;border-width:5px!important}.kpi-ring b{font-size:24px!important}}
.kpi{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 10px;cursor:pointer;text-align:center}
.kpi:hover{border-color:var(--brand-fg)}
.kpi-l{font-weight:700;color:var(--brand-fg);font-size:14px}
.kpi-ring{width:96px;height:96px;border-radius:50%;border:7px solid var(--surface-2);box-shadow:inset 0 0 0 1px var(--line),0 0 0 1px var(--line);display:grid;place-items:center}
.kpi-ring b{font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi.bad .kpi-ring{border-color:var(--bad-bg)}.kpi.bad .kpi-ring b{color:var(--bad)}
.kpi.warn .kpi-ring{border-color:color-mix(in srgb,var(--hivis) 30%,var(--surface))}
.kpi-s{font-size:12px;color:var(--ink-2)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash-grid .wide{grid-column:1/-1}
@media (max-width:860px){.dash-grid{grid-template-columns:1fr}}
.viz{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.viz-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.viz-h h3{font-size:18px;color:var(--brand-fg);letter-spacing:.02em}
.viz-h p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.viz-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.viz-legend span{display:inline-flex;align-items:center;gap:6px}
.viz-legend i,.viz-tip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.viz-plot{position:relative}
.viz-plot svg{width:100%;height:auto;display:block;overflow:visible}
.viz-grid{stroke:var(--line);stroke-width:1}
.viz-axis{stroke:var(--ink-3);stroke-width:1}
.viz-tick{fill:var(--ink-2);font-size:12px;font-family:var(--f-body)}
.viz-cat{fill:var(--ink)}
.viz-val{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.viz-hit{fill:transparent}
.viz-hit.on{fill:color-mix(in srgb,var(--ink) 8%,transparent)}
.viz-tip{position:absolute;z-index:3;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:2px;min-width:140px}
.viz-tip span{display:inline-flex;align-items:center;gap:6px}
.viz-empty{padding:40px 10px;text-align:center;color:var(--ink-2)}
.viz-table{overflow-x:auto}.viz-table table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.viz-table th,.viz-table td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right}.viz-table th:first-child{text-align:left}
.ans.marks{display:grid;grid-template-columns:repeat(5,1fr);width:100%}
.ans.marks button{min-width:0;padding:8px 4px}.ans.marks button small{font-size:10px}
.ans.marks button[aria-pressed="true"].m1,.ans.marks button[aria-pressed="true"].m2{background:var(--bad);color:#fff}
.ans.marks button[aria-pressed="true"].m3{background:var(--hivis);color:var(--hivis-ink)}
.ans.marks button[aria-pressed="true"].m4,.ans.marks button[aria-pressed="true"].m5{background:var(--ok);color:#fff}
.mk{display:inline-block;font-size:13px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.mk1,.mk2{background:var(--bad-bg);color:var(--bad)}.mk3{background:color-mix(in srgb,var(--hivis) 25%,var(--surface));color:var(--ink)}.mk4,.mk5{background:var(--ok-bg);color:var(--ok)}
.pdfdoc .mk3,.pdfdoc .pa-band.b3{background:#fbe9b7}
.pa-band.b1,.pa-band.b2{background:var(--bad-bg);color:var(--bad)}.pa-band.b3{background:color-mix(in srgb,var(--hivis) 25%,var(--surface));color:var(--ink)}.pa-band.b4,.pa-band.b5{background:var(--ok-bg);color:var(--ok)}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.news li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.news li:first-child{border-top:0}
.news a{color:var(--ink);font-weight:600;text-decoration:none;line-height:1.35}
.news a:hover{color:var(--brand-fg);text-decoration:underline}
.news-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-2);align-items:center}
.news-cat{font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.news-cat.c-Accident{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
/* movement planning */
.mv-nav input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:42px}
@media (max-width:520px){.mv-nav input{flex:1 1 100%}}
.mv-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.mv-legend span{display:inline-flex;align-items:center;gap:6px}.mv-legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.mv-card{padding:0}
.mv-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mv{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:13px}
.mv th,.mv td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;vertical-align:middle;text-align:center}
.mv thead th{background:var(--brand);color:#fff;font-weight:700;position:sticky;top:0}
.mv thead th.mv-date{font-weight:500;font-size:12px;background:color-mix(in srgb,var(--brand) 85%,#000)}
.mv thead th.mv-today{background:var(--hivis);color:var(--hivis-ink)}
.mv .mv-name{position:sticky;left:0;z-index:1;background:var(--surface);font-weight:700;min-width:84px}
.mv thead .mv-name{background:var(--brand);z-index:2}
.mv td.mv-des{color:var(--ink-2);white-space:nowrap}
.mv-txt{white-space:pre-line;display:block;min-height:1.2em}
.mv td.mv-cell{min-width:84px}
.mv td.mv-today{box-shadow:inset 0 0 0 2px var(--hivis)}
.mv [role="button"]{cursor:pointer}.mv [role="button"]:hover{outline:2px solid var(--brand-fg);outline-offset:-2px}
.k-site{background:var(--mv-site)!important}.k-office{background:var(--mv-office)!important}.k-leave{background:var(--mv-leave)!important}.k-weekend{background:var(--mv-off)!important;color:var(--ink-2)}
.mv-kinds{display:flex;flex-wrap:wrap;gap:6px}.mv-kinds .chipbtn{color:var(--ink)}.mv-kinds .chipbtn[aria-pressed="true"]{outline:3px solid var(--brand-fg);outline-offset:1px;color:var(--ink);background-clip:padding-box}
.mv-cards{display:none;flex-direction:column;gap:10px}
@media (max-width:760px){.mv-card{display:none}.mv-cards{display:flex}}
.mv-pc{padding:0;overflow:hidden}
.mv-pc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;background:var(--brand);color:#fff}.mv-pc-h .muted{color:rgba(255,255,255,.8);font-size:13px}
.mv-pc-row{display:grid;grid-template-columns:72px 1fr;border-top:1px solid var(--line)}
.mv-pc-row.mv-today .mv-pc-day{background:var(--hivis);color:var(--hivis-ink)}
.mv-pc-day{padding:8px 10px;font-weight:700;font-size:14px;display:flex;flex-direction:column}.mv-pc-day small{font-weight:500;font-size:12px;color:inherit;opacity:.8}
.mv-pc-cell{padding:8px 10px;font-size:14px;min-width:0}
.mv-pc .q-tools{padding:8px 10px;border-top:1px solid var(--line)}
.mv-weeks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pdfdoc .mv{min-width:0}.pdfdoc .mv thead th.mv-date{background:#00007a}
.uc{padding:0;overflow:hidden;text-align:center}
.uc-stripe{height:22px;background:repeating-linear-gradient(-45deg,var(--hivis) 0 22px,#16222e 22px 44px)}
.uc-body{padding:64px 16px 56px;display:flex;flex-direction:column;gap:10px;align-items:center}
.uc-word{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,10vw,96px);line-height:1;letter-spacing:.04em;color:var(--brand-fg);text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer;min-height:38px}
.chipbtn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chipbtn[aria-pressed="true"]::before{content:"✓ "}
.off-note{padding:0 16px 12px;font-size:14px;color:var(--ink-2);background:var(--surface-2)}
@media (max-width:620px){.applic{grid-template-columns:1fr}}

/* report */
.rep-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.kv{display:grid;grid-template-columns:minmax(150px,240px) 1fr;border-top:1px solid var(--line)}
.kv>div{padding:8px 0;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.kv>div:nth-child(odd){color:var(--brand-fg);font-weight:600;font-size:14px;padding-right:12px}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv>div:nth-child(odd){border-bottom:0;padding-bottom:0}}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 9px;border-radius:6px}
.chip.y{background:var(--ok-bg);color:var(--ok)}
.chip.n{background:var(--bad-bg);color:var(--bad)}
.chip.x{background:var(--na-bg);color:var(--na)}
.chip.u{background:var(--surface-2);color:var(--ink-3)}
.rq{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:10px 0;border-top:1px solid var(--line)}
.rq:first-child{border-top:0}
.rq .c{grid-column:1/-1;font-size:14px;color:var(--ink-2)}
.nc-list{display:flex;flex-direction:column;gap:8px}
.nc-item{border-left:4px solid var(--bad);background:var(--bad-bg);border-radius:6px;padding:8px 12px}
.nc-item b{display:block}

.modal{position:fixed;inset:0;z-index:20;background:rgba(10,16,22,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.btn,.row,.ans button{transition:background .12s,border-color .12s}}
</style>

<script>
/* ============ CHECKLIST (from HSSE Site Audit Report form) ============ */
const SECTIONS = [
 {id:"wah",title:"Working at Height",photo:true,qs:[
  "Are the general public and all site workers protected against falling material when working at height?",
  "Platform ladders are using at site with correct angle and level base?"]},
 {id:"scf",title:"Scaffolding",qs:[
  "Scaffolding is using at site with properly installed?",
  "Is it scaffolding inspected and tagging with green/red tag?",
  "Is scaffolding renew the inspection tag every one week?"]},
 {id:"doc",title:"HSSE Document",qs:[
  "WCF, PTW, TBT and High Risk form filled & complete?",
  {t:"Correct JHA tally with the work mention & brief during TBT?",extra:"Number Revision JHA"},
  {t:"Is it Method of Statement standby at site and brief during TBT?",extra:"Number Revision MOS"}]},
 {id:"trf",title:"Traffic Isolation",qs:[
  "Is the construction site securely close to public and to normal traffic?",
  "Are strong hoarding properly installed at site? (if involved in renovation shop)",
  "Hard barricade are adequate and good placement?",
  "Warning sign are adequate and good placement?",
  "Standby flagman to control traffic movement if work at forecourt area / live station / involved traffic.",
  "Install NJB / impact barrier due to traffic movement if work at forecourt area / live station / involved traffic."]},
 {id:"erp",title:"ERP",qs:[
  "Fire extinguisher available at work area? (1 unit NOS ABC 9kg)",
  "Fire extinguisher in a good condition (no expired, no pressure drop & not dusty)",
  "Is it First aid kit available at site?",
  "Is it First aid kit content meet requirement of the National Malaysia Authority?",
  "Is it items in the First Aid kit meet the quantity in the checklist?",
  "Standby Hailer / Whistle for emergency purpose",
  {t:"Is there a first aider at site? If yes, who?",extra:"Name of first aider"}]},
 {id:"crn",title:"Machineries – Mobile Crane",qs:[
  "Have you conducted a pre-operation inspection of the crane, including checking the brakes, hoist, and safety systems?",
  "Are all safety devices (e.g., load moment indicator, anti-two block device) functioning properly?",
  "Has the stability of the ground been assessed to ensure it can support the crane and the load?",
  "Are outrigger pads or steel plate being used to distribute the load evenly?",
  "Are the slings, shackles, and lifting devices inspected and in good condition?",
  "Have weather conditions, such as wind speed, been assessed to ensure safe operation?",
  "Fill up checklist inspection and inspect by operator?"]},
 {id:"sky",title:"Machineries – Skylift",qs:[
  "Has an inspection of the skylift been conducted, including the hydraulic system, tires, and controls?",
  "Is the emergency descent system functional?",
  "Are all workers wearing a full-body harness with a lanyard attached to the designated anchor point?",
  "Is the guardrail system intact and secure?",
  "Is the skylift placed on a stable and level surface with the brakes engaged?",
  "Have wind speed and weather conditions been evaluated for safe operation?",
  "Is the skylift operator properly trained and certified to operate the equipment?",
  "Valid PMA and not expired?",
  "Is the weight of workers, tools, and materials within the skylift's maximum load capacity?",
  "Fill up checklist inspection and inspect by operator?"]},
 {id:"cmp",title:"Competency",qs:[
  "All workers have valid CIDB card, Client requirement, WAH or other?"]},
 {id:"elc",title:"LOTOTO & Electrical",qs:[
  "Lock out tag out test out (LOTOTO) carried out at the main switch board by PW4?",
  "Cable are well protected with cable ramp if exposed to traffic flow.",
  "Using an industrial plug & cable when working",
  "Is all electrical system in a good condition (no exposed wiring, not damaged casing, no burning etc)?",
  "Using external DB box provide for work",
  "Tagging any unwanted wire / isolate wire"]},
 {id:"pwt",title:"Power Tools",qs:[
  "Any power tool / machinery enter at site must be inspected with tagging sticker or colour code base on month.",
  "Perform checklist once tagging the equipment",
  "Any rotation power tool must have proper guard"]},
 {id:"chm",title:"Chemical",qs:[
  "Chemical containers are properly labelled and stored at site?",
  "Location of chemical storage not exposed to sun",
  "SDS hardcopy / tagging available at site",
  "Lock chemical storage if not using it."]},
 {id:"mat",title:"Material Storage",qs:[
  "Create a temporary material storage at work area with proper signage",
  "Sand & brick cover with canvas"]},
 {id:"grn",title:"Greenzone & Visitor Box (for Shell only)",qs:[
  "Is notice erected showing the name, telephone number & address for emergency purpose.",
  "Display related policy at Greenzone?",
  "Proper PPE area at green zone?",
  "Proper food and water tray standby at Green zone",
  "Standby visitor box at green zone and enough item based on checklist"]},
 {id:"wst",title:"Waste Control",qs:[
  "Allocate dumpster at suitable area with cover with canvas and proper signage.",
  "Record waste control checklist."]},
 {id:"ppe",title:"PPE Requirement",qs:[
  "All workers wearing approved safety helmet with chin strap, safety vest & safety shoes?",
  "When required, do the persons carrying out the specific hazardous task wear the appropriate: safety harness with absorber and double lanyard?",
  "When required, do the persons carrying out the specific hazardous task wear the appropriate: safety glass?",
  "When required, do the persons carrying out the specific hazardous task wear the appropriate: Mask N95?",
  "When required, do the persons carrying out the specific hazardous task wear the appropriate: Ear Protection?"]},
 {id:"hk",title:"Housekeeping",qs:[
  "Make sure working area free from any debris / unwanted items after complete work",
  "No obstruction of material or equipment (safe pathway) at work area after complete work"]},
 {id:"spb",title:"Spray Booth",qs:[
  "All equipment for spray booth available? such as water curtain, exhaust fan",
  "Isolate spray booth with Hard Barricade, NJB and Warning Sign?",
  "Worker wear proper PPE such as coverall for painting, half face mask and glove?",
  "Standby spotter person when person doing painting work inside spray booth?"]},
].map(s=>({...s,qs:s.qs.map((q,i)=>{const o=typeof q==="string"?{t:q}:q;return {...o,id:s.id+(i+1),no:(i+1)+".0"}})}));
const ALLQ = SECTIONS.flatMap(s=>s.qs);
const CLIENTS = ["Petronas","Shell","BHP","Petron","Proton","Total Energies","MCD","Mitsubishi","EV","Honda"];

/* ============ HELPERS ============ */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n=>String(n).padStart(2,"0");
function formIdFor(d){return `HSSE - HSE - ${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())} - ${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`}
function localDT(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmtDT(s){if(!s)return "–";const d=new Date(s);if(isNaN(d))return s;return d.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function fmtD(s){if(!s)return "–";const [y,m,d]=String(s).slice(0,10).split("-").map(Number);if(!y||!m||!d)return s;return new Date(y,m-1,d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
const AUDITORS=["Shaiful Syazwan","Ridzuan","Masitah"];
const ENGINEERS=["Not Available","Faiz Azwan","Haziq Jr","Haziq Sr","Azwadi","Johan","Rafiuddin","Izzat Daud","Haidir","Naim","Afifuddin","Aiman Syakir","Izzat Zainal","Rasyid","Syazwan","Azwan","Wafiuddin","Hazim Ramli","Qayyim"];
const CONTRACTORS=["S&F","FYN","Rahmat 1st Engineering","MSL","Tekad Maju","Tiang Desa","Great Edition","Naziq Maju","Renotech","NS Sunrice","LC Speed","Speedy","Inspirasi Jaya","UB Aluminium","CG Makers","NS Search","J&H","Bumi Skala","Megacons"];
function conList(a){if(Array.isArray(a.contractors))return a.contractors;return a.contractor?a.contractor.split(", ").filter(Boolean):[]}
function selFld(id,label,val,list,ph,req=true){const opts=[...list,...(val&&!list.includes(val)?[val]:[])];return `<div class="fld"><label class="${req?"req":""}" for="f_${id}">${label}</label><select id="f_${id}" data-f="${id}"><option value="">${ph}</option>${opts.map(c=>`<option ${c===val?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){IDB.set(k,v).catch(()=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("This device is out of storage – export a backup and delete old records")}})}
/* device storage (used when the page runs outside claude.ai, e.g. on GitHub Pages): IndexedDB holds photos too */
const IDB={db:null,
  open(){return this._p||(this._p=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("no idb"));const r=indexedDB.open("hsse-safety",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){await this.open();return new Promise(res=>{const q=this.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})},
  async set(k,v){await this.open();return new Promise((res,rej)=>{const tx=this.db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}};
async function devGet(k){try{const v=await IDB.get(k);if(v!=null)return v}catch(e){}return lsGet(k)}

const SEC_OF={};SECTIONS.forEach(s=>s.qs.forEach(q=>SEC_OF[q.id]=s));
/* section applicability: true = involved at this site, false = not involved (all N/A), undefined = not decided yet */
function secState(a,s){
  const v=a.secOn?.[s.id];if(v===true||v===false)return v;
  return s.qs.some(q=>a.answers?.[q.id]?.v)?true:undefined; // older records without the switch
}
function eff(a,q){const s=SEC_OF[q.id];const on=secState(a,s);if(on===false)return "NA";return on?a.answers?.[q.id]?.v||"":""}
function score(a){
  let y=0,n=0,x=0,u=0;const per={};
  for(const s of SECTIONS){let sy=0,sn=0,sx=0,su=0;const on=secState(a,s);
    for(const q of s.qs){const v=eff(a,q);if(v==="Y")sy++;else if(v==="N")sn++;else if(v==="NA")sx++;else su++;}
    per[s.id]={y:sy,n:sn,x:sx,u:su,on};y+=sy;n+=sn;x+=sx;u+=su;}
  const pct=(y+n)?y/(y+n)*100:null;
  const undecided=SECTIONS.filter(s=>per[s.id].on===undefined).length;
  return {y,n,x,u,pct,per,undecided,total:ALLQ.length,answered:ALLQ.length-u};
}
const pctTxt=p=>p==null?"–":(Math.round(p*10)/10).toFixed(p%1===0?0:1)+"%";

async function initCaps(){
  const c=window.claude;
  if(!c||!c.use){useLocal();return}
  const timer=setTimeout(()=>{if(!loaded)useLocal()},10000);
  try{ db=await c.use("db"); }catch(e){db=null}
  if(!db){clearTimeout(timer);useLocal();return}
  mode="shared";
  c.use("assets").then(a=>assets=a).catch(()=>{});
  c.use("downloads").then(d=>downloads=d).catch(()=>{});
  c.use("user").then(async u=>{userCap=u;try{me=u?await u.id():null}catch(e){}}).catch(()=>{});
  startShared(timer);
}
function startShared(timer){
  subscribeTasks();subscribeTb();subscribePa();subscribeMv();
  db.collection("audits").onSnapshot(snap=>{
    clearTimeout(timer);
    const m=new Map();snap.docs.forEach(d=>{if(d.exists){const v=d.data();m.set(v.id,v)}});
    // keep local unsaved edits for the open audit
    if(current&&dirty)m.set(current.id,current);
    audits=m;loaded=true;
    if(view==="list")keepFocus(renderList);else if(view==="dash")keepFocus(renderDash);
    else if(view==="report"&&current){const fresh=audits.get(current.id);if(fresh){current=structuredClone(fresh);renderReport()}}
  },err=>{clearTimeout(timer);if(!loaded)useLocal();else setSave("Connection lost – changes may not save","bad")});
}
async function useLocal(){
  if(mode==="shared"&&loaded)return;
  mode="local";db=null;
  const [A,T,B,PA,MV]=await Promise.all(["hsse-audits","hsse-tasks","hsse-toolbox","hsse-production","hsse-movement"].map(devGet));pas=new Map((PA||[]).map(r=>[r.id,r]));paLoaded=true;moves=new Map((MV||[]).map(r=>[r.id,r]));mvLoaded=true;

let saveChain=Promise.resolve(), saveTimer=null, dirty=false;
function setSave(t,k){const s=$("#saveState");s.textContent=t;s.style.color=k==="bad"?"var(--hivis)":""}
function queueSave(){dirty=true;setSave("Unsaved…");clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,700)}
function saveNow(){
  clearTimeout(saveTimer);if(!current)return saveChain;
  const snap=structuredClone(current);snap.updatedAt=new Date().toISOString();current.updatedAt=snap.updatedAt;
  const sc=score(snap);snap.pct=sc.pct;snap.nc=sc.n;snap.answered=sc.answered;
  audits.set(snap.id,snap);
  saveChain=saveChain.then(async()=>{
    setSave("Saving…");
    try{
      let r;if(mode==="shared"){r=await db.collection("audits").doc(snap.id).set(snap)}
      else await IDB.set("hsse-audits",[...audits.values()]);
      dirty=false;if(r!=="pending")setSave(mode==="shared"?"All changes saved":"Saved on this device");
    }catch(e){
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));
        try{await db.collection("audits").doc(snap.id).set(snap);dirty=false;setSave("All changes saved");return}catch(e2){e=e2}}
      setSave(e&&e.code==="invalid_argument"?"You have view-only access – not saved":e&&e.code==="quota_exceeded"?"Storage full – not saved":"Not saved – check connection","bad");
    }
  });
  return saveChain;
}

/* photos: shared asset store if allowed, else compressed copy in db, else inline (local) */
async function compress(file,max,q){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res({blob:b,data:c.toDataURL("image/jpeg",q)}),"image/jpeg",q));
  }finally{URL.revokeObjectURL(url)}
}
async function storePhoto(file){
  const name=file.name||"photo.jpg";const at=new Date().toISOString();
  if(assets){try{const {blob}=await compress(file,1600,.75);const r=await assets.upload(blob,{type:"image/jpeg"});
    return {k:"a",id:r.id,name,at}}catch(e){}}
  const {data}=await compress(file,900,.6);
  if(mode==="shared"){const id=uid();try{await db.collection("photos").doc(id).set({data,name,at});photoCache.set(id,data);return {k:"d",id,name,at}}catch(e){}}
  return {k:"i",data,name,at};
}
async function photoSrc(p){
  if(p.k==="a")return "/_blob/"+p.id;
  if(p.k==="i")return p.data;
  if(p.k==="g"){const key="gp:"+p.id;if(photoCache.has(key))return photoCache.get(key);let d=await devGet(key);
    if(!d&&typeof driveOn==="function"&&driveOn()){try{const j=await callServer(driveUrl,{type:"photo",token:session.token,id:p.id});d=`data:${j.type};base64,${j.data}`;await devPut(key,d)}catch(e){d=""}}
    if(d)photoCache.set(key,d);return d||""}
  if(photoCache.has(p.id))return photoCache.get(p.id);
  try{const s=await db.collection("photos").doc(p.id).get();const d=s.exists?s.data().data:"";photoCache.set(p.id,d);return d}catch(e){return ""}
}
function photosHTML(list,key,editable){
  return `<div class="photos" data-pkey="${key}">${(list||[]).map((p,i)=>`<div class="ph"><img alt="${esc(p.name)}" data-ph='${esc(JSON.stringify(p))}'>${editable?`<button class="rm" data-rmph="${key}" data-i="${i}" aria-label="Remove photo">×</button>`:""}</div>`).join("")}</div>`;
}
function hydratePhotos(root){root.querySelectorAll("img[data-ph]").forEach(async img=>{try{const p=JSON.parse(img.dataset.ph);img.src=await photoSrc(p)}catch(e){}})}

        const s=SECTIONS.find(x=>x.id===sid);note.textContent=`Not involved at this site · ${s.qs.length} question${s.qs.length>1?"s":""} recorded as N/A`}
      else if(note)note.remove();
      updateScore();queueSave();return}
    if(t.dataset.showc){const id=t.dataset.showc;ansOf(id).open=true;const w=app.querySelector(`[data-cwrap="${id}"]`);w.hidden=false;w.querySelector("textarea").focus();t.remove();return}
    if(t.dataset.addph){pickPhotos(t.dataset.addph);return}
    if(t.dataset.rmph){const arr=photoList(t.dataset.rmph);arr.splice(+t.dataset.i,1);refreshPhotos(t.dataset.rmph);queueSave();return}
    if(t.dataset.sigsave){const c=app.querySelector(`canvas[data-sig="${t.dataset.sigsave}"]`);if(!c._drawn){toast("Draw a signature first");return}
      current[t.dataset.sigsave]=trimSig(c);rerenderSig(t.dataset.sigsave);queueSave();return}
    if(t.dataset.sigreset){const c=app.querySelector(`canvas[data-sig="${t.dataset.sigreset}"]`);c.getContext("2d").clearRect(0,0,c.width,c.height);c._drawn=false;return}
    if(t.dataset.sigclear){current[t.dataset.sigclear]="";rerenderSig(t.dataset.sigclear);queueSave();return}
    if(t.id==="btnDel"){confirmBox("Delete this audit?","This removes the audit and its answers for everyone. It cannot be undone.","Delete",async()=>{
      const id=current.id;audits.delete(id);dirty=false;current=null;if(driveLog.has("audit_"+id))setTimeout(()=>driveSend("audit",id),500);
      try{if(mode==="shared")await db.collection("audits").doc(id).delete();else await IDB.set("hsse-audits",[...audits.values()])}catch(e){toast("Could not delete – check your access")}
      go("list");toast("Audit deleted")});return}
  };
  bindInputs(app);
}
function bindInputs(root){
  root.querySelectorAll("[data-c]").forEach(el=>el.oninput=()=>{ansOf(el.dataset.c).c=el.value;if(el.value.trim())el.classList.remove("c-missing");const w=$(`[data-ncwarn="${el.dataset.c}"]`);if(w&&el.value.trim())w.remove();queueSave()});
  root.querySelectorAll("[data-x]").forEach(el=>el.oninput=()=>{ansOf(el.dataset.x).x=el.value;queueSave()});
}
function photoList(key){
  if(key==="share")return current.sharingPhotos||(current.sharingPhotos=[]);
  if(key.startsWith("sec:")){const s=key.slice(4);current.sectionPhotos=current.sectionPhotos||{};return current.sectionPhotos[s]||(current.sectionPhotos[s]=[])}
  const a=ansOf(key.slice(2));return a.p||(a.p=[]);
}
function refreshPhotos(key){const box=$(`[data-pkey="${CSS.escape(key)}"]`);if(!box)return;const t=document.createElement("div");t.innerHTML=photosHTML(photoList(key),key,true);const n=t.firstElementChild;box.replaceWith(n);hydratePhotos(n)}
function pickPhotos(key){
  const inp=$("#fileIn");inp.value="";
  inp.onchange=async()=>{
    const files=[...inp.files];if(!files.length)return;
    const box=$(`[data-pkey="${CSS.escape(key)}"]`);
    const ph=files.map(()=>{const d=document.createElement("div");d.className="ph loading";box.appendChild(d);return d});
    for(let i=0;i<files.length;i++){try{const p=await storePhoto(files[i]);photoList(key).push(p)}catch(e){toast("A photo could not be added")}ph[i].remove()}
    refreshPhotos(key);queueSave();
  };
  inp.click();
}

/* signatures */
function initSigs(){
  document.querySelectorAll("canvas[data-sig]").forEach(c=>{
    const ctx=c.getContext("2d");ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";
    let drawing=false;
    const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
    c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);const [x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();c._drawn=true};
    c.onpointermove=e=>{if(!drawing)return;const [x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke()};
    c.onpointerup=c.onpointercancel=()=>{drawing=false};
  });
}
function trimSig(c){
  const ctx=c.getContext("2d");const {data,width,height}=ctx.getImageData(0,0,c.width,c.height);
  let x0=width,y0=height,x1=0,y1=0;
  for(let y=0;y<height;y+=2)for(let x=0;x<width;x+=2){if(data[(y*width+x)*4+3]>0){if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y}}
  const p=12;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(width,x1+p);y1=Math.min(height,y1+p);
  const o=document.createElement("canvas");const s=Math.min(1,400/(x1-x0||1));o.width=Math.round((x1-x0)*s);o.height=Math.round((y1-y0)*s);
  const octx=o.getContext("2d");octx.fillStyle="#fff";octx.fillRect(0,0,o.width,o.height);octx.drawImage(c,x0,y0,x1-x0,y1-y0,0,0,o.width,o.height);
  return o.toDataURL("image/png");
}
function rerenderSig(key){
  const old=document.querySelector(`canvas[data-sig="${key}"]`)?.closest(".sig")||document.querySelector(`[data-sigclear="${key}"]`)?.closest(".sig");
  const t=document.createElement("div");t.innerHTML=sigHTML(key,key==="sigAuditor"?"Signature of auditor":"Acknowledge by PH / WL",current[key]);old.replaceWith(t.firstElementChild);initSigs();
}

function updateScore(){
  const sc=score(current);
  for(const s of SECTIONS){const p=sc.per[s.id];const el=document.querySelector(`[data-sc="${s.id}"]`);
    if(el)el.textContent=p.on===undefined?"Choose Yes / No":p.on===false?"Not involved":p.u===s.qs.length?`0 / ${s.qs.length} answered`:(p.y+p.n)?`${p.y} / ${p.y+p.n} · ${pctTxt(p.y/(p.y+p.n)*100)}`:p.u?`${s.qs.length-p.u} / ${s.qs.length} answered`:"All N/A"}
  $("#jump").innerHTML=`<a href="#sec-details" data-jump="sec-details">Details</a>`+SECTIONS.map(s=>{const p=sc.per[s.id];return `<a href="#sec-${s.id}" data-jump="sec-${s.id}" class="${p.on===false?"off":p.n?"has-nc":p.on&&p.u===0?"done":""}">${esc(s.title.replace("Machineries – ",""))}</a>`}).join("")+`<a href="#sec-ack" data-jump="sec-ack">Acknowledge</a>`;
  $("#jump").querySelectorAll("a").forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.jump).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})});
  $("#scorebar").innerHTML=`<div class="scorebar-in">
    <div class="meter"><div class="track"><div class="fill" style="width:${sc.answered/sc.total*100}%"></div></div>
      <div class="lab">${sc.undecided?`<b style="color:var(--bad)">${sc.undecided} section${sc.undecided>1?"s":""} to choose</b> · `:""}<b>${sc.answered}/${sc.total}</b> answered ·<span style="color:var(--ok)">${sc.y} comply</span> · <span style="color:var(--bad)">${sc.n} not comply</span> · ${sc.x} N/A</div></div>
    <div class="pct" title="Score = Comply ÷ (Comply + Not comply)">${pctTxt(sc.pct)}</div>
    <button class="btn" id="btnPreview">Preview</button>
    <button class="btn brand" id="btnSubmit">Submit &amp; close</button></div>`;
  $("#btnPreview").onclick=()=>{saveNow();go("report")};
  $("#btnSubmit").onclick=submitAudit;
}
function submitAudit(){
  const a=current;const sc=score(a);const miss=[];
  if(!a.site)miss.push("Location site");if(!a.client)miss.push("Client");if(!a.work)miss.push("Work conducted");if(!a.auditBy)miss.push("Audit by");if(!a.sharingPhotos?.length)miss.push("Sharing photo (TBT, Coaching, Training) – attach at least 1 photo");if(!a.engineer)miss.push("Name of Site Engineer / Site Supervisor");if(!a.contractor&&!(a.contractorOther||"").trim())miss.push("Team Contractor / Installer");
  if(!a.sigAuditor)miss.push("Auditor signature");
  const undec=SECTIONS.filter(s=>sc.per[s.id].on===undefined);
  if(undec.length)miss.push(`Choose Yes / No for ${undec.length} section${undec.length>1?"s":""}: ${undec.map(s=>s.title).join(", ")}`);
  const unans=ALLQ.filter(q=>secState(a,SEC_OF[q.id])===true&&!eff(a,q));
  if(unans.length)miss.push(`${unans.length} unanswered question${unans.length>1?"s":""} in open sections`);
  const ncNoCList=ALLQ.filter(q=>eff(a,q)==="N"&&!(a.answers[q.id].c||"").trim());const ncNoC=ncNoCList.length;
  ncNoCList.forEach(q=>document.querySelector(`[data-q="${q.id}"] textarea`)?.classList.add("c-missing"));
  if(ncNoC)miss.push(`${ncNoC} Not comply item${ncNoC>1?"s":""} without a comment`);
  if(miss.length){
    infoBox("Complete the audit first",`<ul style="margin:0;padding-left:18px">${miss.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`);
    if(!a.site||!a.client||!a.work||!a.auditBy||!a.engineer||!a.sharingPhotos?.length||!(a.contractor||(a.contractorOther||"").trim())||!a.sigAuditor)document.getElementById("sec-details").scrollIntoView();
    undec.forEach(s=>document.querySelector(`#sec-${s.id} .applic`)?.classList.add("missing"));
    unans.forEach(q=>document.querySelector(`[data-q="${q.id}"]`)?.classList.add("missing"));
    if(!unans.length&&!undec.length&&ncNoC&&a.site&&a.client&&a.work&&a.auditBy&&a.engineer&&a.sharingPhotos?.length&&a.sigAuditor&&(a.contractor||(a.contractorOther||"").trim()))document.querySelector(`[data-q="${ncNoCList[0].id}"]`)?.scrollIntoView({block:"center"});
    if(!a.site||!a.client||!a.work||!a.auditBy||!a.engineer||!a.sharingPhotos?.length||!(a.contractor||(a.contractorOther||"").trim())||!a.sigAuditor);
    else if(undec.length)document.getElementById("sec-"+undec[0].id).scrollIntoView();
    else if(unans.length)document.querySelector(`[data-q="${unans[0].id}"]`).scrollIntoView({block:"center"});
    return}
  confirmBox("Submit and close this audit?",`Final score <b>${pctTxt(sc.pct)}</b> with ${sc.n} not comply item${sc.n===1?"":"s"}. You can reopen it later if needed.`,"Submit",async()=>{
    a.status="closed";a.closedAt=new Date().toISOString();await saveNow();go("report");toast("Audit submitted");driveSend("audit",a.id)});
}

      <div class="pdf-title"><div><h1>${esc(title)}</h1><div class="muted">${sub}</div></div>${right||""}</div></div>`+body;
    document.body.appendChild(box);

    await Promise.all([...box.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    try{await document.fonts.ready}catch(e){}
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"pt",format:"a4"});
    const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),m=28,cw=W-2*m,bottom=H-m-14;
    let y=m;
    const blocks=[box.querySelector(".pdf-head"),...box.querySelectorAll(":scope > section.card")];
    for(const el of blocks){
      const cv=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
      const hpt=cv.height*cw/cv.width;
      if(y>m&&y+hpt>bottom&&hpt<=bottom-m){pdf.addPage();y=m}
      let sy=0;
      while(sy<cv.height){
        let avail=bottom-y;if(avail<40){pdf.addPage();y=m;avail=bottom-y}
        const sh=Math.min(cv.height-sy,Math.floor(avail*cv.width/cw));
        const c=document.createElement("canvas");c.width=cv.width;c.height=sh;c.getContext("2d").drawImage(cv,0,sy,cv.width,sh,0,0,cv.width,sh);
        const ph=sh*cw/cv.width;pdf.addImage(c.toDataURL("image/jpeg",0.85),"JPEG",m,y,cw,ph);
        sy+=sh;y+=ph+10;if(sy<cv.height){pdf.addPage();y=m}

      pdf.text(`${footer}  ·  Generated ${fmtDT(new Date().toISOString())}`,m,H-m+4);pdf.text(`Page ${i} / ${n}`,W-m,H-m+4,{align:"right"})}
    if(blobOnly)return pdf.output("blob");
    await save(filename,pdf.output("blob"));
  }catch(e){if(blobOnly)throw e;toast("Could not create the PDF – check your connection and try again")}
  finally{box.remove();if(btn){btn.disabled=false;btn.textContent="Download PDF"}}
}

function dueDate(t){if(!t.due)return null;const [y,m,d]=t.due.split("-").map(Number);const [hh,mm]=(t.dueTime||"17:00").split(":").map(Number);return new Date(y,m-1,d,hh||0,mm||0)}
function isOverdue(t){const d=dueDate(t);return t.status!=="C"&&d&&d<new Date()}
function remaining(t){
  if(t.status==="C")return {txt:`Completed${t.completedAt?" "+fmtD(t.completedAt.slice(0,10)):""}`,cls:"done"};
  const d=dueDate(t);if(!d)return {txt:"No due date",cls:""};
  let ms=d-new Date();const over=ms<0;ms=Math.abs(ms);
  const day=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),mi=Math.floor(ms%36e5/6e4);
  const span=day?`${day} day${day>1?"s":""} ${h} h`:h?`${h} h ${mi} min`:`${mi} min`;
  return over?{txt:`Overdue by ${span}`,cls:"over"}:{txt:`${span} left`,cls:ms<2*864e5?"soon":""};
}
function fmtDue(t){const d=dueDate(t);return d?d.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"–"}

    if(view==="tb")keepFocus(renderTb);else if(view==="dash")keepFocus(renderDash);else if(view==="tbview"&&curTb&&tbs.get(curTb.id)){curTb=structuredClone(tbs.get(curTb.id));renderTbView()}},
    ()=>{if(!tbLoaded){tbLoaded=true;if(view==="tb")renderTb()}});
}

async function saveTb(t){tbs.set(t.id,t);if(mode==="shared")await db.collection("toolbox").doc(t.id).set(t);else await IDB.set("hsse-toolbox",[...tbs.values()])}
function tbPoints(t){return Array.isArray(t.points)?t.points:(t.topic||"").split("\n").map(x=>x.replace(/^\s*([-•*]|\d+[.)])\s*/,"").trim()).filter(Boolean)}
function newTb(){const n=new Date();return {id:uid(),briefBy:"",date:localDT(n).slice(0,10),time:localDT(n).slice(11,16),location:"",topic:"",photos:[],createdAt:n.toISOString(),updatedAt:n.toISOString(),createdBy:me||null,_new:true}}
function fmtTime(t){if(!t)return "";const [h,m]=t.split(":").map(Number);return `${((h+11)%12)+1}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`}
function renderTb(){
  if(view!=="tb")return;

  const now=new Date();const ym=localDT(now).slice(0,7);const today=localDT(now).slice(0,10);
  const wk=new Date(now);wk.setDate(now.getDate()-6);const wkS=localDT(wk).slice(0,10);
  const q=tbFilter.q.toLowerCase();const shown=arr.filter(t=>!q||[t.briefBy,t.location,t.topic,t.date].join(" ").toLowerCase().includes(q));
  $("#app").innerHTML=`
   <div><h1>Toolbox meeting</h1><div class="muted">Daily factory toolbox briefings with the key hazards covered and a photo of each briefing.</div></div>
   <div class="tiles">
     <div class="tile"><div class="k">Today</div><div class="v">${arr.filter(t=>t.date===today).length}</div></div>
     <div class="tile"><div class="k">Last 7 days</div><div class="v">${arr.filter(t=>t.date>=wkS&&t.date<=today).length}</div></div>
     <div class="tile"><div class="k">This month</div><div class="v">${arr.filter(t=>t.date.startsWith(ym)).length}</div></div>
     <div class="tile"><div class="k">Total</div><div class="v">${arr.length}</div></div>
   </div>
   <div class="toolbar"><input id="tbq" type="search" placeholder="Search topic, hazard, location, person…" value="${esc(tbFilter.q)}" aria-label="Search toolbox meetings"><button class="btn" id="btnTbCsv">Export CSV</button></div>
   <div class="list">${!tbLoaded?`<div class="empty">Loading toolbox meetings…</div>`:shown.length?shown.map(t=>`
     <button class="tbrow" data-tb="${t.id}">
       <div class="tbthumb">${t.photos?.[0]?`<img alt="" data-ph='${esc(JSON.stringify(t.photos[0]))}'>`:""}${t.photos?.length>1?`<span>+${t.photos.length-1}</span>`:""}</div>
       <div class="tbinfo"><div class="tbdate">${fmtD(t.date)} · ${fmtTime(t.time)}</div>
         <div class="tbtopic">${esc(tbPoints(t).join(" · "))}</div>
         <div class="tk-meta">${esc(t.location||"–")} · Brief by ${esc(t.briefBy||"–")}</div></div>
     </button>`).join(""):`<div class="empty">${arr.length?"No meetings match your search.":"No toolbox meetings yet. Tap <b>+ New toolbox</b> to record today's briefing."}</div>`}</div>`;
  hydratePhotos($("#app"));
  $("#tbq").oninput=e=>{tbFilter.q=e.target.value;const pos=e.target.selectionStart;renderTb();const f=$("#tbq");f.focus();f.setSelectionRange(pos,pos)};
  $("#btnTbCsv").onclick=exportTbCsv;
  document.querySelectorAll("[data-tb]").forEach(b=>b.onclick=()=>{curTb=structuredClone(tbs.get(b.dataset.tb));go("tbview")});

function tbBody(t){return `
   <section class="card"><div class="card-h"><h2>Toolbox meeting</h2></div><div class="card-b"><div class="kv">
     <div>Brief by</div><div>${esc(t.briefBy||"–")}</div>
     <div>Date</div><div>${fmtD(t.date)}</div>
     <div>Time</div><div>${fmtTime(t.time)||"–"}</div>
     <div>Location</div><div>${esc(t.location||"–")}</div>
     <div>Topic / key hazard briefed</div><div>${tbPoints(t).length?`<ol class="pts-view">${tbPoints(t).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:"–"}</div>
   </div></div></section>
   <section class="card"><div class="card-h"><h2>Photo of briefing</h2><span class="sc">${t.photos?.length||0} photo${t.photos?.length===1?"":"s"}</span></div><div class="card-b" style="padding-top:12px">
     ${t.photos?.length?`<div class="photos tbbig">${t.photos.map(p=>`<div class="ph"><img alt="Briefing photo" data-ph='${esc(JSON.stringify(p))}'></div>`).join("")}</div>`:`<div class="muted">No photo</div>`}

function renderTbView(){

  t.points=tbPoints(t);if(!t.points.length)t.points=[""];
  $("#app").innerHTML=`
   <div class="rep-head"><div><h1>${t._new?"New toolbox meeting":"Edit toolbox meeting"}</h1><div class="muted">Fill in the briefing details and attach a photo of the briefing.</div></div></div>
   <section class="card"><div class="card-h"><h2>Briefing details</h2></div><div class="card-b"><div class="grid2">

    hydratePhotos(box);box.querySelectorAll("[data-tbrm]").forEach(b=>b.onclick=()=>{t.photos.splice(+b.dataset.tbrm,1);drawPh()})};
  drawPh();

    ol.querySelectorAll("[data-pt]").forEach(el=>{el.oninput=()=>{t.points[+el.dataset.pt]=el.value};
      el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();t.points.splice(+el.dataset.pt+1,0,"");drawPts(+el.dataset.pt+1)}}});
    ol.querySelectorAll("[data-ptrm]").forEach(b=>b.onclick=()=>{t.points.splice(+b.dataset.ptrm,1);drawPts()});

  $("#tb_add").onclick=()=>{const inp=$("#tbFile");inp.value="";inp.onchange=async()=>{
    const files=[...inp.files];if(!files.length)return;const row=$("#tb_ph .photos");

    for(let i=0;i<files.length;i++){try{t.photos.push(await storePhoto(files[i]))}catch(e){toast("A photo could not be added")}ph[i].remove()}

    const miss=[];if(!t.briefBy)miss.push("Brief by");if(!t.date)miss.push("Date");if(!t.time)miss.push("Time");if(!t.location)miss.push("Location");if(!pts.length)miss.push("Topic / key hazard briefed – add at least 1 point");if(!t.photos.length)miss.push("Photo of briefing – attach at least 1 photo");

    try{await saveTb(structuredClone(t));go("tbview");toast(wasNew?"Toolbox meeting saved":"Changes saved");driveSend("toolbox",t.id)}
    catch(e){t._new=wasNew;btn.disabled=false;toast(e?.code==="invalid_argument"?"You have view-only access – not saved":"Not saved – check connection")}
  };
}
function exportTbCsv(){
  const cols=["Date","Time","Brief by","Location","Topic / key hazard briefed","Photos"];const cell=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[...tbs.values()].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(t=>[t.date,t.time,t.briefBy,t.location,tbPoints(t).map((x,i)=>`${i+1}. ${x}`).join("\n"),t.photos?.length||0]);
  save(`hsse-toolbox-${localDT(new Date()).slice(0,10)}.csv`,[cols,...rows].map(r=>r.map(cell).join(",")).join("\r\n"));
}

/* ============ SIGN-IN + GOOGLE DRIVE (GitHub address) ============ */
// Outside claude.ai, team members sign in with the email + password kept in the "Users" tab of the
// department's Google Sheet (checked by the department's Apps Script). Records stay on each device, and each
// submitted audit, saved task and saved toolbox meeting is copied to Google Drive by the same script.
let driveUrl="", session=null, driveLog=new Map(), driveBusy=false, driveLoaded=false;
const DTYPE={audit:"Site audit",task:"Task",toolbox:"Toolbox meeting",production:"Production audit"};
function driveAvail(){return !window.claude}
function sessionOk(){return !!(session&&session.token&&session.exp>Date.now())}
function driveOn(){return driveAvail()&&!!driveUrl&&sessionOk()}
async function loadDrive(){
  if(driveLoaded||!driveAvail())return;driveLoaded=true;
  driveUrl=(window.HSSE_DRIVE_URL||"").trim()||((await devGet("drive-url"))||"");
  session=(await devGet("session"))||null;driveLog=new Map(Object.entries((await devGet("drive-log"))||{}));
  window.addEventListener("online",()=>{processDriveQueue();pullSync()});setInterval(()=>{processDriveQueue();pullSync()},120000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pullSync()});
}
async function devPut(k,v){try{await IDB.set(k,v)}catch(e){lsSet(k,v)}}
async function saveDriveLog(){await devPut("drive-log",Object.fromEntries(driveLog))}
function needLogin(){return driveAvail()&&!sessionOk()}
function showAccountButton(){const b=$("#btnDrive");if(!b)return;b.hidden=!driveAvail()||!sessionOk();b.textContent="Account"}

/* ----- sign-in screen ----- */
function showLogin(msg){
  document.querySelector(".tabs").hidden=true;$("#btnNew").hidden=true;$("#btnHome").hidden=true;$("#scorebar").hidden=true;$("#btnDrive").hidden=true;
  const askUrl=!(window.HSSE_DRIVE_URL||"").trim();
  $("#app").innerHTML=`<section class="card login"><div class="card-h"><h2>Sign in</h2></div><form class="card-b" id="loginForm" novalidate><div class="grid2">
    <div class="fld full"><label for="li_email">Email</label><input id="li_email" type="email" autocomplete="username" inputmode="email" value="${esc(session?.email||"")}"></div>
    <div class="fld full"><label for="li_pw">Password</label><input id="li_pw" type="password" autocomplete="current-password"></div>
    ${askUrl?`<div class="fld full"><label for="li_url">Server link</label><input id="li_url" inputmode="url" value="${esc(driveUrl)}" placeholder="https://script.google.com/macros/s/…/exec"><span class="muted" style="font-size:13px">Ask your HSSE admin for this link. You only enter it once.</span></div>`:""}
    <div class="fld full"><div class="warn" id="li_msg">${esc(msg||"")}</div></div>
    <div class="toolbar"><button class="btn brand" type="submit" id="li_go">Sign in</button></div>
    <div class="fld full muted" style="font-size:13px">Forgot your password? Ask your HSSE admin to set a new one for you.</div>
  </div></form></section>`;
  $("#loginForm").onsubmit=async e=>{e.preventDefault();
    const em=$("#li_email").value.trim(),pw=$("#li_pw").value;const url=askUrl?$("#li_url").value.trim():driveUrl;
    const m=t=>$("#li_msg").textContent=t;
    if(!em||!pw){m("Enter your email and password.");return}
    if(!urlOk(url)){m("The server link should start with https://script.google.com/macros/s/ and end with /exec");return}
    if(!navigator.onLine){m("No internet connection. You need signal the first time you sign in.");return}
    $("#li_go").disabled=true;m("Signing in…");
    try{const j=await callServer(url,{type:"login",email:em,password:pw});
      session={token:j.token,email:j.email,name:j.name,exp:j.exp};driveUrl=url;await devPut("session",session);if(askUrl)await devPut("drive-url",url);
      $("#li_msg").textContent="";document.querySelector(".tabs").hidden=false;$("#btnNew").hidden=false;showAccountButton();
      toast(`Signed in as ${j.name}`);
      if(j.mustChange){go("drive");setTimeout(()=>{const x=$("#ac_msg");if(x)x.textContent="Please change the starting password your admin gave you."},50)}
      else go(location.hash==="#tasks"?"tasks":location.hash==="#tb"?"tb":location.hash==="#audits"?"list":location.hash==="#pa"?"pa":location.hash==="#mv"?"mv":location.hash==="#plan"?"plan":"dash");
      processDriveQueue();pullSync();}
    catch(err){m(err.message);const b=$("#li_go");if(b)b.disabled=false}};
}
const urlOk=u=>/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[^/]+\/exec$/.test(u)||(!!window.HSSE_DRIVE_TEST&&/^https?:\/\//.test(u));
async function callServer(url,payload){
  let r;try{r=await fetch(url,{method:"POST",body:JSON.stringify(payload)})}catch(e){throw new Error("Could not reach the server – check your internet connection")}
  let j;try{j=await r.json()}catch(e){throw new Error("The server link is not working – check it with your HSSE admin")}
  if(!j.ok){const msg={"wrong login":"Email or password is not correct.","too many tries":"Too many wrong tries. Wait 15 minutes and try again.","signed out":"Please sign in again."}[j.error]||j.error||"The server did not accept the request";
    const err=new Error(msg);err.code=j.error;throw err}
  return j;
}
async function signOut(){if(dirty)await saveNow();session=null;await devPut("session",null);location.hash="";showLogin("You are signed out.")}

/* ----- Drive upload ----- */
const sheetSafe=v=>{v=v==null?"":v;return typeof v==="string"&&/^[=+\-@]/.test(v)?"'"+v:v};
async function blobToB64(b){return new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(",")[1]);f.onerror=rej;f.readAsDataURL(b)})}
let lastPhotoIdx=new Map();
async function photoPayload(list){
  const out=[];let n=0;lastPhotoIdx=new Map();
  for(const [label,arr] of list){for(const p of arr||[]){try{const src=await toDataUrl(await photoSrc(p));if(!src)continue;n++;lastPhotoIdx.set(p,out.length);
    out.push({name:`${String(n).padStart(2,"0")} ${label}.jpg`.replace(/[\\/:*?"<>|]/g,"-"),type:(src.match(/^data:([^;]+)/)||[])[1]||"image/jpeg",data:src.split(",")[1]})}catch(e){}}}
  return out;
}
/* the full record travels with each upload so other devices can sync it; photos become placeholders for the uploaded files */
async function buildDrivePayload(type,id){
  lastPhotoIdx=new Map();const p=await buildDrivePayload0(type,id);
  const live=({audit:audits,task:tasks,toolbox:tbs,production:pas,movement:moves})[type]?.get(id);
  if(p&&!p.deleted&&live){const idx=lastPhotoIdx;
    p.record=JSON.parse(JSON.stringify(live,(k,v)=>{if(v&&typeof v==="object"&&!Array.isArray(v)&&["a","d","i","g"].includes(v.k)&&("id" in v||"data" in v)){
      if(idx.has(v))return {k:"p",i:idx.get(v),name:v.name||""};return v.k==="g"?v:undefined}return v}));}
  return p;
}
async function buildDrivePayload0(type,id){
  if(type==="movement")return moves.has(id)?{type,id}:{type,id,deleted:true};
  const month=d=>(d||new Date().toISOString()).slice(0,7);
  if(type==="audit"){
    const a=audits.get(id);if(!a||a.status!=="closed")return {type,id,deleted:true};
    const sc=score(a);const args=auditPdfArgs(a);const pdf=await makePdf({...args,blobOnly:true});
    const ncs=ALLQ.filter(q=>eff(a,q)==="N").map(q=>`${SEC_OF[q.id].title} ${q.no}: ${a.answers[q.id]?.c||""}`);
    const photos=await photoPayload([["Sharing photo",a.sharingPhotos],...SECTIONS.map(s=>[s.title,secState(a,s)===true?a.sectionPhotos?.[s.id]:[]]),
      ...ALLQ.filter(q=>secState(a,SEC_OF[q.id])===true).map(q=>[`${SEC_OF[q.id].title} ${q.no}`,a.answers[q.id]?.p])]);
    return {type,id,month:month(a.conductedOn),folderName:`${(a.conductedOn||"").slice(0,10)} ${a.site||"Site"}`.trim(),
      pdf:{name:args.filename,data:await blobToB64(pdf)},photos,
      row:[["Status","Closed"],["Conducted on",a.conductedOn||""],["Location site",a.site],["Client",a.client],["Work conducted",a.work],["Audit by",a.auditBy],
        ["Site Engineer / Supervisor",a.engineer],["Contractor / Installer",[a.contractor,a.contractorOther].filter(Boolean).join(", ")],["Man-power",a.manpower],
        ["Score %",sc.pct==null?"":Math.round(sc.pct*10)/10],["Comply",sc.y],["Not comply",sc.n],["N/A",sc.x],
        ["Sections not involved",SECTIONS.filter(s=>secState(a,s)===false).map(s=>s.title).join(", ")],["Not comply findings",ncs.join("\n")],
        ["PH / WL",a.ackName],["Submitted",a.closedAt?fmtDT(a.closedAt):""]].map(([k,v])=>[k,sheetSafe(v)])};
  }
  if(type==="task"){
    const t=tasks.get(id);if(!t)return {type,id,deleted:true};const last=t.log?.length?t.log[t.log.length-1]:null;
    return {type,id,month:month(t.due),row:[["Task",t.title],["Details",t.desc],["Assigned to",t.assignee],["Priority",TPRIO[t.priority||"M"]],["Status",TSTATUS[t.status]],
      ["Progress %",t.pct||0],["Start date",t.start],["Date to complete",t.due],["Time",t.dueTime],["Remaining",remaining(t).txt],
      ["Completed on",t.completedAt?fmtDT(t.completedAt):""],["Latest update",last?`${fmtDT(last.at)} – ${last.note||TSTATUS[last.status]+" "+last.pct+"%"}`:""]].map(([k,v])=>[k,sheetSafe(v)])};
  }
  if(type==="production"){
    const r=pas.get(id);if(!r||r.status!=="closed")return {type,id,deleted:true};const sc=paScore(r);const args=paPdfArgs(r);const pdf=await makePdf({...args,blobOnly:true});
    const low=paItemsOn(r).filter(q=>+(r.marks?.[q.id]?.v)&&+r.marks[q.id].v<=2).map(q=>`${q.id} ${q.t} – mark ${r.marks[q.id].v}: ${r.marks[q.id].c||""}`);
    return {type,id,month:month(r.date),folderName:`${r.date} ${r.area||"Area"}`,pdf:{name:args.filename,data:await blobToB64(pdf)},
      photos:await photoPayload(paItemsOn(r).map(q=>[`Item ${q.id}`,r.marks?.[q.id]?.p])),
      row:[["Status","Submitted"],["Date",r.date],["Area",r.area],["Supervisor",r.supervisor],["Activity",r.activity],["Audit by",r.auditBy],["Total",sc.tot],["Max",sc.max],["Sections not involved",PA_SECTIONS.filter(sec=>paSecState(r,sec)===false).map(sec=>sec.title).join(", ")],
        ["Score %",sc.pct==null?"":Math.round(sc.pct*10)/10],["Rating",sc.band],...PA_SECTIONS.map(sec=>[`No.${sec.no} ${sec.title}`,`${sc.per[sec.no].t}/${sc.per[sec.no].max}`]),
        ["Low marks (1–2)",low.join("\n")],["Submitted",r.closedAt?fmtDT(r.closedAt):""]].map(([k,v])=>[k,sheetSafe(v)])};
  }
  if(type==="toolbox"){
    const t=tbs.get(id);if(!t)return {type,id,deleted:true};const args=tbPdfArgs(t);const pdf=await makePdf({...args,blobOnly:true});
