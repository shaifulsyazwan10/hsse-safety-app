let syncBusy=false;
async function pullSync(){
  if(syncBusy||!driveOn()||!navigator.onLine)return;syncBusy=true;
  try{
    const since=(await devGet("sync-since"))||"";const first=!(await devGet("sync-pushed-v1"));
    const mine=first?{audit:[...audits.values()].filter(a=>a.status==="closed").map(a=>a.id),task:[...tasks.keys()],toolbox:[...tbs.keys()],production:[...pas.values()].filter(r=>r.status==="closed").map(r=>r.id)}:null;
    const j=await callServer(driveUrl,{type:"sync",token:session.token,since});
    const maps={audit:[audits,"hsse-audits"],task:[tasks,"hsse-tasks"],toolbox:[tbs,"hsse-toolbox"],production:[pas,"hsse-production"],movement:[moves,"hsse-movement"]};
    const touched=new Set();const q=await driveQueue();
    for(const it of j.items||[]){const m=maps[it.type];if(!m)continue;const map=m[0];const local=map.get(it.id);const k=it.type+"_"+it.id;
      if(q.some(x=>x.type===it.type&&x.id===it.id))continue; // a change made here is still waiting to upload: keep it
      if(it.deleted){if(local&&(it.type==="task"||it.type==="toolbox"||it.type==="movement"||local.status==="closed")){map.delete(it.id);touched.add(it.type)}driveLog.delete(k);continue}
      const r=it.record;if(!r)continue;
      if(!local||(local.updatedAt||"")<(r.updatedAt||"")){map.set(it.id,r);touched.add(it.type)}
      driveLog.set(k,{at:it.updated,pdfUrl:it.pdfUrl||"",sheetUrl:it.sheetUrl||"",deleted:false});}
    for(const t of touched)await IDB.set(maps[t][1],[...maps[t][0].values()]);
    await saveDriveLog();await devPut("sync-since",j.now);
    if(first){await devPut("sync-pushed-v1",true);const now=Date.now();const qq=await driveQueue();
      for(const [type,ids] of Object.entries(mine))for(const id of ids)if(!qq.some(x=>x.type===type&&x.id===id))qq.push({type,id,at:now});
      await driveQueueSet(qq);processDriveQueue()}
    if(touched.size){if(view==="mv")renderMv();else if(view==="list")keepFocus(renderList);else if(view==="tasks")keepFocus(renderTasks);else if(view==="tb")keepFocus(renderTb);else if(view==="pa")keepFocus(renderPa);else if(view==="dash")keepFocus(renderDash);
      if(since)toast("New updates from your team")}
    refreshDriveChips();
  }catch(e){if(e&&e.code==="signed out"){session=null;await devPut("session",null);showLogin("Your sign-in has ended. Please sign in again – your records are safe on this device.")}}
  finally{syncBusy=false}
}
async function driveQueue(){try{return (await IDB.get("drive-queue"))||[]}catch(e){return lsGet("drive-queue")||[]}}
async function driveQueueSet(q){await devPut("drive-queue",q)}
async function driveSend(type,id){
  if(!driveAvail())return;
  const q=(await driveQueue()).filter(x=>!(x.type===type&&x.id===id));q.push({type,id,at:Date.now()});await driveQueueSet(q);
  refreshDriveChips();processDriveQueue();
}
async function processDriveQueue(){
  if(driveBusy||!driveOn()||!navigator.onLine)return;driveBusy=true;
  try{
    let q=await driveQueue();
    while(q.length){
      const it=q[0];let res,p;
      try{p=await buildDrivePayload(it.type,it.id);res=await callServer(driveUrl,{...p,token:session.token});
        driveLog.set(it.type+"_"+it.id,{at:new Date().toISOString(),pdfUrl:res.pdfUrl||"",folderUrl:res.folderUrl||"",sheetUrl:res.sheetUrl||"",deleted:!!p.deleted});await saveDriveLog();
        if(!p.deleted)toast(`${DTYPE[it.type]} saved to Google Drive`);}
      catch(e){if(/HSSE manager/.test(e.message||"")){toast(e.message);q=(await driveQueue()).filter(x=>!(x.type===it.type&&x.id===it.id));await driveQueueSet(q);continue}
        if(e.code==="signed out"){session=null;await devPut("session",null);showLogin("Your sign-in has ended. Please sign in again – your records are safe on this device.")}break}
      q=(await driveQueue()).filter(x=>!(x.type===it.type&&x.id===it.id&&x.at<=it.at));await driveQueueSet(q);
    }
  }finally{driveBusy=false;refreshDriveChips()}
}
function driveChip(type,id){if(!driveAvail())return "";return `<span class="drivechip" data-drive="${type}_${id}"></span>`}
async function refreshDriveChips(){
  const els=document.querySelectorAll("[data-drive]");if(!els.length)return;const q=await driveQueue();
  els.forEach(el=>{const k=el.dataset.drive;const log=driveLog.get(k);const waiting=q.some(x=>x.type+"_"+x.id===k);
    if(waiting){el.className="drivechip wait";el.textContent=navigator.onLine?"Uploading to Google Drive…":"Will upload to Google Drive when there is signal";}
    else if(log&&!log.deleted){el.className="drivechip ok";el.innerHTML=`Saved to Google Drive · ${esc(fmtDT(log.at))}${log.pdfUrl?` · <a href="${esc(log.pdfUrl)}" target="_blank" rel="noopener">Open PDF</a>`:log.sheetUrl?` · <a href="${esc(log.sheetUrl)}" target="_blank" rel="noopener">Open sheet</a>`:""}`}
    else{el.className="drivechip";el.textContent=""}});
}

// GitHub address: the department's Apps Script collects Google News every day at 6 AM (Malaysia time) and returns it here.
// claude.ai: read from the shared db document news/latest (written by the daily news task).
let news={items:[],updated:"",state:"idle",err:""}, newsCat="all", newsMore=false, newsSub=false, newsAsked=0;
const NEWS_CATS=[["all","All"],["DOSH","DOSH / JKKP"],["DOE","DOE / JAS"],["Accident","Workplace accidents"],["Safety & health","Safety & health"]];
async function loadNews(force){
  if(driveAvail()){
    if(!news.items.length){const c=await devGet("news-cache");if(c&&c.items)news={...c,state:"idle",err:""}}
    if(!driveOn()){renderNewsCard();return}
    const stale=!news.updated||Date.now()-new Date(news.updated).getTime()>3*36e5;
    if(!force&&!stale&&Date.now()-newsAsked<6e5){renderNewsCard();return}
    newsAsked=Date.now();news.state="loading";renderNewsCard();
    try{const j=await callServer(driveUrl,{type:"news",token:session.token,force:!!force});news={items:j.items||[],updated:j.updated||new Date().toISOString(),state:"idle",err:""};await devPut("news-cache",{items:news.items,updated:news.updated})}
    catch(e){news.state="idle";news.err=navigator.onLine?(/news|bad request/.test(e.message)?"The server needs the latest script update to show news.":e.message):"No internet connection – showing the last saved news."}
    renderNewsCard();return;
  }
  if(db&&!newsSub){newsSub=true;db.collection("news").onSnapshot(s=>{const d=s.docs.find(x=>x.id==="latest");if(d){const v=d.data();news={items:v.items||[],updated:v.updated||"",state:"idle",err:""}}renderNewsCard()},()=>{})}
  renderNewsCard();
}
function newsAgo(iso){const d=new Date(iso);if(isNaN(d))return "";const h=(Date.now()-d)/36e5;if(h<1)return "Just now";if(h<24)return `${Math.floor(h)} h ago`;const dd=Math.floor(h/24);return dd===1?"Yesterday":dd<7?`${dd} days ago`:fmtD(iso.slice(0,10))}
function renderNewsCard(){
  const el=$("#newsCard");if(!el)return;
  const list=news.items.filter(n=>newsCat==="all"||n.cat===newsCat);const shown=list.slice(0,newsMore?40:8);
  const cnt=k=>k==="all"?news.items.length:news.items.filter(n=>n.cat===k).length;
  let body;
  if(driveAvail()&&!driveOn())body=`<div class="viz-empty">Sign in to see the latest news.</div>`;
  else if(!news.items.length&&news.state==="loading")body=`<div class="viz-empty">Loading the latest news…</div>`;
  else if(!news.items.length)body=`<div class="viz-empty">${driveAvail()?"No news yet. The server collects news every day at 6 AM – tap Refresh to check now.":"Daily DOSH, DOE and workplace accident news is shown on the GitHub version of this app: shaifulsyazwan10.github.io/hsse-safety-app"}</div>`;
  else if(!list.length)body=`<div class="viz-empty">No news in this group in the last few weeks.</div>`;
  else body=`<ul class="news">${shown.map(n=>`<li><a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>
     <div class="news-meta"><span class="news-cat c-${esc(String(n.cat).replace(/[^A-Za-z]/g,""))}">${esc((NEWS_CATS.find(c=>c[0]===n.cat)||[0,n.cat])[1])}</span>${n.source?`<span>${esc(n.source)}</span>`:""}<span>${esc(newsAgo(n.date))}</span></div></li>`).join("")}</ul>
     ${list.length>8?`<button class="small-btn" id="news_more">${newsMore?"Show fewer":`Show ${Math.min(40,list.length)-8} more`}</button>`:""}`;
  el.innerHTML=`<div class="viz-h"><div><h3>Safety &amp; Health News</h3></div>
    ${driveAvail()&&driveOn()?`<button class="small-btn" id="news_ref" ${news.state==="loading"?"disabled":""}>${news.state==="loading"?"Refreshing…":"Refresh"}</button>`:""}</div>
    ${news.err?`<div class="warn">${esc(news.err)}</div>`:""}
    ${news.items.length?`<div class="chips">${NEWS_CATS.map(([k,l])=>`<button class="chipbtn" data-ncat="${esc(k)}" aria-pressed="${newsCat===k}">${l} · ${cnt(k)}</button>`).join("")}</div>`:""}
    ${body}
    <div class="muted" style="font-size:12px">Headlines from Google News (English and Malay)${news.updated?` · last update ${esc(newsAgo(news.updated).toLowerCase())}`:""}. Tap a headline to read the full story on the news website.</div>`;
  el.querySelectorAll("[data-ncat]").forEach(b=>b.onclick=()=>{newsCat=b.dataset.ncat;newsMore=false;renderNewsCard()});
  if($("#news_more"))$("#news_more").onclick=()=>{newsMore=!newsMore;renderNewsCard()};
  if($("#news_ref"))$("#news_ref").onclick=()=>loadNews(true);
}

/* Import the weekly sheets of the Excel planning file (one sheet per week, layout as "HSSE Team Movement Planning") */
async function importMvExcel(file){
  if(!file)return;toast("Reading Excel file…");
  try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js")}catch(e){toast("Could not load the Excel reader – check your connection");return}
  let wb;try{wb=XLSX.read(await file.arrayBuffer(),{cellStyles:true})}catch(e){toast("This file could not be read as Excel");return}
  const COL={"92D050":"site","00B050":"site","FFF067":"office","FFFF00":"office","FF0000":"leave"};
  const kindOf=(c)=>{const rgb=String(c?.s?.fgColor?.rgb||"").toUpperCase().slice(-6);if(COL[rgb])return COL[rgb];const t=String(c?.v||"").trim();
    if(/^weekend$/i.test(t))return "weekend";if(/^(PH|AL|EL|MC|CL|leave|cuti|on leave)\b/i.test(t))return "leave";if(/^office$/i.test(t))return "office";return t?"site":""};
  const parseDate=v=>{if(typeof v==="number"){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${pad(d.m)}-${pad(d.d)}`:""}const m=String(v||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:""};
  const found=[];
  for(const name of wb.SheetNames){const ws=wb.Sheets[name];const rng=XLSX.utils.decode_range(ws["!ref"]||"A1");const cell=(r,c)=>ws[XLSX.utils.encode_cell({r,c})];
    let hr=-1;for(let r=rng.s.r;r<=Math.min(rng.e.r,30);r++){if(/^name$/i.test(String(cell(r,0)?.v||"").trim())){hr=r;break}}if(hr<0)continue;
    const mon=parseDate(cell(hr+1,2)?.v);if(!mon)continue;const [y,m,d]=mon.split("-").map(Number);const id=ymd(mondayOf(new Date(y,m-1,d)));
    const people=[];for(let r=hr+2;r<=rng.e.r;r++){const n=String(cell(r,0)?.v||"").trim();if(!n)continue;
      people.push({name:n,designation:String(cell(r,1)?.v||"").trim(),days:[2,3,4,5,6,7,8].map(c=>{const x=cell(r,c);return {t:String(x?.v||"").replace(/\r\n/g,"\n").trim(),k:kindOf(x)}}),leave:String(cell(r,9)?.v||"").trim(),remarks:String(cell(r,10)?.v||"").trim()})}
    if(people.length)found.push({id,people,createdAt:new Date().toISOString(),source:file.name+" / "+name});}
  found.sort((x,y)=>x.id.localeCompare(y.id));
  if(!found.length){infoBox("No weeks found","The file needs one sheet per week with a <b>Name</b> header, the dates under Monday–Sunday, and one row per person.");return}
  const over=found.filter(w=>moves.has(w.id)).length;
  confirmBox(`Import ${found.length} week${found.length>1?"s":""}?`,`${found.map(w=>fmtD(w.id)).join(", ")}${over?`<br><br>${over} week${over>1?"s are":" is"} already planned and will be replaced.`:""}`,"Import",async()=>{
    try{for(const w of found)await saveMv(w);mvWeek=found.map(w=>w.id).sort().find(id=>id>=ymd(mondayOf(new Date())))||found[0].id;renderMv();toast(`Imported ${found.length} week${found.length>1?"s":""}`)}catch(e){toast("Not saved – check connection")}});
}

function niceStep(v){const raw=Math.max(1,v/4);const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,5,10])if(raw<=m*p)return m*p;return 10*p}
function rpath(x,y,w,h,r,end){ // rounded only at the data end (top for vertical, right for horizontal)
  r=Math.min(r,w/2,h/2);if(w<=0||h<=0)return "";
  if(end==="top")return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
  return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`;

/* stacked bar chart (vertical or horizontal), plain SVG; series = [{name,color,values[]}] */
function barChart(el,{cats,series,horizontal,fmt=v=>String(v),onPick,empty="No records in this period"}){
  const tot=cats.map((_,i)=>series.reduce((s,se)=>s+(se.values[i]||0),0));

  const legend=series.length>1?`<div class="viz-legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`:"";

    H=W<480?220:260;const L=34,R=8,T=18,B=42;const every=Math.ceil(cats.length/Math.max(1,Math.floor((W-42)/46)));const pw=W-L-R,ph=H-T-B,band=pw/cats.length,bw=Math.min(46,band*.62);
    ticks.forEach(t=>{const y=T+ph-ph*t/max;svg+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="viz-grid"/><text x="${L-6}" y="${y+4}" class="viz-tick" text-anchor="end">${fmt(t)}</text>`});

        svg+=`<path d="${rpath(x,y+gap,bw,Math.max(0,h-gap),k===top?4:0,"top")}" fill="${s.color}"/>`;hits.push({x,y,w:bw,h,ci:i,si:k});y0=y});
      if(tot[i])svg+=`<text x="${x+bw/2}" y="${y0-6}" class="viz-val" text-anchor="middle">${fmt(tot[i])}</text>`;
      if(i%every===0)svg+=`<text x="${x+bw/2}" y="${H-B+18}" class="viz-tick" text-anchor="middle">${esc(c)}</text>`});
    svg+=`<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" class="viz-axis"/>`;
  }else{
    const row=34,T=10,B=28,L=Math.min(Math.round(W*.42),12+7*Math.max(...cats.map(c=>Math.min(26,String(c).length)))),R=40;H=T+B+row*cats.length;const pw=W-L-R,bh=18;
    ticks.forEach(t=>{const x=L+pw*t/max;svg+=`<line y1="${T}" y2="${H-B}" x1="${x}" x2="${x}" class="viz-grid"/><text y="${H-B+18}" x="${x}" class="viz-tick" text-anchor="middle">${fmt(t)}</text>`});
    cats.forEach((c,i)=>{const y=T+row*i+(row-bh)/2;let x0=L;const last=series.map(s=>s.values[i]||0).reduce((a,v,k)=>v?k:a,-1);
      svg+=`<text x="${L-8}" y="${y+bh/2+4}" class="viz-tick viz-cat" text-anchor="end"><title>${esc(c)}</title>${esc(String(c).length>26?String(c).slice(0,25)+"…":c)}</text>`;
      series.forEach((s,k)=>{const v=s.values[i]||0;if(!v)return;const w=pw*v/max;const gap=k===last?0:2;

    svg+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" class="viz-axis"/>`;
  }
  // hit targets: whole category band, larger than the mark
  const hitSvg=hits.map((h,n)=>horizontal?`<rect class="viz-hit" data-n="${n}" x="${h.x}" y="${h.y-7}" width="${Math.max(h.w,10)}" height="${h.h+14}"/>`:`<rect class="viz-hit" data-n="${n}" x="${h.x-6}" y="${h.y}" width="${h.w+12}" height="${Math.max(h.h,10)}"/>`).join("");

  renderNewsCard();loadNews(false);
  // months in range (max 12, ending at the latest month in range or now)
  const allDates=[...P.map(r=>r.date),...A.map(a=>a.conductedOn),...B.map(t=>t.date),...T.map(t=>t.due)].filter(Boolean).map(d=>d.slice(0,7)).sort();
  let endM=localDT(new Date()).slice(0,7);if(dashF.range==="custom"&&dashF.to)endM=dashF.to.slice(0,7);
  let startM=from==="0000"?(allDates[0]||endM):from.slice(0,7);
  const months=[];{let [y,m]=startM.split("-").map(Number);const [ey,em]=endM.split("-").map(Number);while((y<ey||(y===ey&&m<=em))&&months.length<60){months.push(`${y}-${String(m).padStart(2,"0")}`);m++;if(m>12){m=1;y++}}}
  const ms=months.slice(-12);const mLabel=m=>new Date(+m.slice(0,4),+m.slice(5,7)-1,1).toLocaleDateString("en-GB",{month:"short",year:"2-digit"});
  const cnt=(arr,key)=>ms.map(m=>arr.filter(x=>(x[key]||"").startsWith(m)).length);
  barChart($("#c_month"),{cats:ms.map(mLabel),series:[{name:"Site audits",color:SERIES.s1,values:cnt(A,"conductedOn")},{name:"Toolbox meetings",color:SERIES.s2,values:cnt(B,"date")},{name:"Tasks due",color:SERIES.s3,values:cnt(T,"due")},{name:"Production audits",color:"var(--s4)",values:cnt(P,"date")}]});
  const lg=[...new Set(P.map(r=>r.area).filter(Boolean))].map(a=>{const s=P.filter(r=>r.area===a).map(paScore).filter(x=>x.pct!=null);return {a,v:s.length?Math.round(s.reduce((t,x)=>t+x.pct,0)/s.length):0,n:s.length}}).filter(x=>x.n).sort((x,y)=>y.v-x.v).slice(0,10);
  barChart($("#c_league_d"),{cats:lg.map(x=>`${x.a} (${x.n})`),series:[{name:"Average score",color:SERIES.s1,values:lg.map(x=>x.v)}],horizontal:true,fmt:v=>Math.round(v)+"%",empty:"No submitted production audits in this period",
    onPick:i=>{paFilter={q:lg[i].a,st:"closed"};go("pa")}});
  // NC by section
  const nc=SECTIONS.map(s=>({s,n:A.reduce((t,a)=>t+s.qs.filter(q=>eff(a,q)==="N").length,0)})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,8);
  barChart($("#c_nc"),{cats:nc.map(x=>x.s.title.replace("Machineries – ","")),series:[{name:"Not comply",color:SERIES.s1,values:nc.map(x=>x.n)}],horizontal:true,empty:"No not comply findings in this period",
    onPick:i=>{listFilter={q:"",st:"closed"};go("list")}});
  // score by client
  const cl=[...new Set(A.map(a=>a.client).filter(Boolean))].map(c=>{const s=A.filter(a=>a.client===c).map(score).filter(x=>x.pct!=null);return {c,v:s.length?Math.round(s.reduce((t,x)=>t+x.pct,0)/s.length):0,n:s.length}}).filter(x=>x.n).sort((a,b)=>a.v-b.v);
  barChart($("#c_client"),{cats:cl.map(x=>`${x.c} (${x.n})`),series:[{name:"Average score",color:SERIES.s1,values:cl.map(x=>x.v)}],horizontal:true,fmt:v=>Math.round(v)+"%",empty:"No submitted audits in this period",
    onPick:i=>{listFilter={q:cl[i].c,st:"closed"};go("list")}});
  // priority
  const pr=["H","M","L"];const stS=[["O","On going",SERIES.s1],["P","Pending",SERIES.s2],["C","Complete",SERIES.s3]];
  barChart($("#c_prio"),{cats:pr.map(p=>TPRIO[p]),series:stS.map(([k,n,c])=>({name:n,color:c,values:pr.map(p=>T.filter(t=>(t.priority||"M")===p&&t.status===k).length)})),empty:"No tasks in this period",
    onPick:(ci,si)=>{taskFilter={st:stS[si][0],who:who,pr:pr[ci],q:""};go("tasks")}});
  // leaderboard
  const ppl=[...new Set(T.map(t=>t.assignee).filter(Boolean))].map(p=>({p,n:T.filter(t=>t.assignee===p).length})).sort((a,b)=>b.n-a.n);
  barChart($("#c_lead"),{cats:ppl.map(x=>x.p),series:stS.map(([k,n,c])=>({name:n,color:c,values:ppl.map(x=>T.filter(t=>t.assignee===x.p&&t.status===k).length)})),horizontal:true,empty:"No tasks in this period",
    onPick:(ci,si)=>{taskFilter={st:stS[si][0],who:ppl[ci].p,pr:"",q:""};go("tasks")}});
  // wiring
  if(!window.__dashResize){window.__dashResize=true;let tm;window.addEventListener("resize",()=>{clearTimeout(tm);tm=setTimeout(()=>{if(view==="dash")renderDash()},200)})}
  const saveF=()=>{try{localStorage.setItem("hsse-dash",JSON.stringify(dashF))}catch(e){}renderDash()};
  $("#df_range").onchange=e=>{dashF.range=e.target.value;saveF()};
  $("#df_who").onchange=e=>{dashF.who=e.target.value;saveF()};
  if($("#df_from")){$("#df_from").onchange=e=>{dashF.from=e.target.value;saveF()};$("#df_to").onchange=e=>{dashF.to=e.target.value;saveF()}}
  $("#df_reset").onclick=()=>{dashF={range:"90",from:"",to:"",who:""};saveF()};
  document.querySelectorAll("[data-tbl]").forEach(b=>b.onclick=()=>{const t=b.closest(".viz").querySelector(".viz-table");if(!t)return;t.hidden=!t.hidden;b.textContent=t.hidden?"Table":"Chart only"});
  document.querySelectorAll(".kpi").forEach(k=>k.onclick=()=>{const g=k.dataset.go;if(g.startsWith("tasks:")){taskFilter={st:g.slice(6),who,pr:"",q:""};go("tasks")}else if(g==="list"){listFilter={q:"",st:"closed"};go("list")}else go(g)});
}
/* ============ BOOT ============ */
$("#btnNew").onclick=()=>{if(TABOF[view]==="tb"){curTb=newTb();go("tbedit");return}
  if(TABOF[view]==="pa"){curPa=newPa();go("paedit");return}
  if(view==="tasks"||view==="task"){curTask=newTask();go("task");return}
  if(view==="form"&&dirty)saveNow();current=newAudit();audits.set(current.id,current);go("form");queueSave()};
$("#btnHome").onclick=()=>go("list");
$("#btnDrive").onclick=()=>go("drive");
window.addEventListener("beforeunload",()=>{if(dirty)saveNow()});
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("#hdrLogo").src=LOGO;
if(location.hash==="#tasks")go("tasks");else if(location.hash==="#tb")go("tb");else if(location.hash==="#audits")go("list");else if(location.hash==="#pa")go("pa");else if(location.hash==="#mv")go("mv");else if(location.hash==="#plan")go("plan");else go("dash");
initCaps();
</script>
</body></html>
